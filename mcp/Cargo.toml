[package]
name = "quantion-mcp"
version = "0.2.4"
edition = "2024"
description = "MCP server that lets AI agents process LCMS files with Quant·ion on your own computer."
license = "MIT"
repository = "https://github.com/phenological/quantion"
homepage = "https://phenological.github.io/quantion/"
readme = "README.md"
keywords = ["mass-spectrometry", "lcms", "mcp", "ai", "agents"]
categories = ["science", "command-line-utilities"]
exclude = ["tests/**"]

[[bin]]
name = "quantion-mcp"
path = "src/main.rs"

[dependencies]
quantion = { path = "../core", version = "=0.2.4" }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = "symbols"
